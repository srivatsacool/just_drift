<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drift - 8-Bit Arcade Racer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <style>
    /* ==================== RESET ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --pixel-black: #0a0a0f;
      --pixel-dark: #1a1a2e;
      --pixel-gray: #2d2d3a;
      --neon-yellow: #ffd166;
      --neon-cyan: #4ecdc4;
      --neon-green: #00ff88;
      --neon-red: #ff6b6b;
      --font-pixel: 'Press Start 2P', monospace;
    }
    
    html, body {
      font-family: var(--font-pixel);
      background: var(--pixel-black);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* ==================== SCANLINES ==================== */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
      );
    }
    
    /* ==================== HERO SECTION ==================== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      background: 
        linear-gradient(180deg, rgba(10,10,15,0.7) 0%, rgba(26,26,46,0.8) 100%),
        url('/bg_2.jpeg') center center / cover no-repeat;
    }
    
    /* ==================== LOGO ==================== */
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .game-logo {
      max-width: 350px;
      width: 90%;
      height: auto;
      margin-bottom: 10px;
    }
    
    .game-title {
      font-size: clamp(24px, 6vw, 48px);
      color: var(--neon-yellow);
      text-shadow: 
        3px 3px 0 var(--neon-red),
        -1px -1px 0 var(--neon-cyan),
        0 0 30px var(--neon-yellow);
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    
    .tagline {
      font-size: clamp(8px, 2vw, 12px);
      color: var(--neon-cyan);
      letter-spacing: 2px;
      opacity: 0.9;
    }
    
    /* ==================== MENU BUTTONS ==================== */
    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 40px;
    }
    
    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      font-family: var(--font-pixel);
      font-size: 14px;
      text-decoration: none;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    
    .menu-btn.primary {
      background: linear-gradient(180deg, var(--neon-cyan) 0%, #2a9d8f 100%);
      color: var(--pixel-black);
      border-bottom: 4px solid #1a6b5c;
      box-shadow: 0 4px 25px rgba(78, 205, 196, 0.4);
    }
    
    .menu-btn.secondary {
      background: linear-gradient(180deg, var(--pixel-gray) 0%, var(--pixel-dark) 100%);
      color: #fff;
      border-bottom: 4px solid var(--pixel-black);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    
    .menu-btn:hover {
      transform: translateY(-2px);
    }
    
    .menu-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    
    .menu-btn .icon {
      font-size: 18px;
    }
    
    /* ==================== HOW TO PLAY ==================== */
    .howto-section {
      width: 100%;
      max-width: 600px;
      background: rgba(26, 26, 46, 0.9);
      border: 2px solid var(--pixel-gray);
      border-radius: 12px;
      padding: 24px;
    }
    
    .howto-title {
      font-size: 14px;
      color: var(--neon-yellow);
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--pixel-gray);
    }
    
    .howto-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
    }
    
    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .step-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .step-text {
      font-size: 8px;
      color: #aaa;
      line-height: 1.6;
    }
    
    .step-text strong {
      display: block;
      color: #fff;
      margin-bottom: 4px;
      font-size: 9px;
    }
    
    /* ==================== FOOTER ==================== */
    .footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
    }
    
    .footer-text {
      font-size: 12px;
      color: #888;
    }
    
    .footer-text a {
      color: var(--neon-cyan);
      text-decoration: none;
    }
    
    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 480px) {
      .hero {
        padding: 20px 16px;
      }
      
      .menu-section {
        max-width: 280px;
      }
      
      .menu-btn {
        font-size: 11px;
        padding: 14px 20px;
      }
      
      .howto-section {
        padding: 16px;
      }
      
      .howto-steps {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @media (min-height: 800px) {
      .logo-section {
        margin-bottom: 50px;
      }
      
      .menu-section {
        margin-bottom: 60px;
      }
    }
  </style>
</head>
<body>
  <!-- Scanlines -->
  <div class="scanlines"></div>
  
  <!-- Hero Section -->
  <section class="hero">
    <!-- Logo -->
    <div class="logo-section">
      <h1 class="game-title">JUST DRIFT</h1>
      <p class="tagline">OUTRUN THE COPS • DRIFT TO SURVIVE</p>
    </div>
    
    <!-- Menu Buttons -->
    <div class="menu-section">
      <a href="/display" class="menu-btn primary">
        <span class="icon">🎮</span>
        <span>PLAY GAME</span>
      </a>
      <a href="/controller" class="menu-btn secondary">
        <span class="icon">📱</span>
        <span>CONTROLLER</span>
      </a>
    </div>
    
    <!-- How To Play -->
    <div class="howto-section">
      <h2 class="howto-title">📖 HOW TO PLAY</h2>
      <div class="howto-steps">
        <div class="step">
          <div class="step-icon">🖥️</div>
          <p class="step-text">
            <strong>STEP 1</strong>
            Open DISPLAY on your TV or laptop
          </p>
        </div>
        <div class="step">
          <div class="step-icon">📱</div>
          <p class="step-text">
            <strong>STEP 2</strong>
            Open CONTROLLER on your phone
          </p>
        </div>
        <div class="step">
          <div class="step-icon">🔢</div>
          <p class="step-text">
            <strong>STEP 3</strong>
            Enter the 4-digit room code
          </p>
        </div>
        <div class="step">
          <div class="step-icon">🏎️</div>
          <p class="step-text">
            <strong>STEP 4</strong>
            Outrun the police!
          </p>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <footer class="footer">
      <p class="footer-text">Made with ❤️ by <a href="#">BUILD.SRIVATSA</a></p>
    </footer>
  </section>
</body>
</html>
