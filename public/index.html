<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drift - Outrun the Cops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Press Start 2P', cursive;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('/bg_2.jpeg') center center / cover no-repeat;
      overflow: hidden;
    }
    
    /* Dark overlay for readability */
    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(10, 10, 15, 0.85) 0%, 
        rgba(26, 26, 46, 0.8) 50%,
        rgba(15, 32, 39, 0.85) 100%
      );
      z-index: 1;
    }
    
    /* Animated background road */
    .road-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 38px,
        #2d2d3a 38px,
        #2d2d3a 40px
      );
      animation: roadScroll 2s linear infinite;
      opacity: 0.3;
    }
    
    @keyframes roadScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    
    /* Floating pixels decoration */
    .pixel-decoration {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ffd166;
      opacity: 0.3;
      animation: float 3s ease-in-out infinite;
    }
    
    .pixel-decoration:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
    .pixel-decoration:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.5s; background: #4ecdc4; }
    .pixel-decoration:nth-child(3) { top: 60%; left: 5%; animation-delay: 1s; background: #e63946; }
    .pixel-decoration:nth-child(4) { top: 80%; right: 10%; animation-delay: 1.5s; }
    .pixel-decoration:nth-child(5) { top: 40%; left: 20%; animation-delay: 2s; background: #4ecdc4; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(45deg); }
    }
    
    /* Game logo */
    .logo-container {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-bottom: 20px;
    }
    
    .game-title {
      font-size: clamp(2rem, 8vw, 5rem);
      color: #e63946;
      text-shadow: 
        4px 4px 0 #000,
        8px 8px 0 rgba(0,0,0,0.3),
        0 0 30px rgba(230, 57, 70, 0.5);
      letter-spacing: 4px;
      animation: titlePulse 2s ease-in-out infinite;
    }
    
    @keyframes titlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .tagline {
      font-size: clamp(0.5rem, 2vw, 0.9rem);
      color: #ffd166;
      margin-top: 15px;
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 2px;
    }
    
    /* Car image container */
    .car-showcase {
      position: relative;
      z-index: 10;
      margin: 30px 0;
      width: 100%;
      max-width: 400px;
      animation: carBounce 3s ease-in-out infinite;
    }
    
    .car-showcase img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
    }
    
    @keyframes carBounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    
    /* Menu container */
    .menu-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    
    /* 8-bit style menu buttons */
    .menu-btn {
      position: relative;
      padding: 18px 50px;
      font-family: 'Press Start 2P', cursive;
      font-size: clamp(0.7rem, 2vw, 1rem);
      border: none;
      cursor: pointer;
      transition: all 0.1s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-width: 280px;
    }
    
    /* Primary button (Play) */
    .menu-btn.primary {
      background: linear-gradient(180deg, #4ecdc4 0%, #26a69a 100%);
      color: #000;
      box-shadow: 
        0 6px 0 #1a7a6f,
        0 8px 15px rgba(0, 0, 0, 0.4),
        inset 0 -3px 0 rgba(0,0,0,0.2);
    }
    
    .menu-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 0 #1a7a6f,
        0 12px 20px rgba(0, 0, 0, 0.4),
        inset 0 -3px 0 rgba(0,0,0,0.2);
    }
    
    .menu-btn.primary:active {
      transform: translateY(6px);
      box-shadow: 
        0 0 0 #1a7a6f,
        0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* Secondary buttons */
    .menu-btn.secondary {
      background: linear-gradient(180deg, #3d3d5c 0%, #2d2d3a 100%);
      color: #fff;
      border: 3px solid #4a4a5a;
      box-shadow: 
        0 6px 0 #1a1a2e,
        0 8px 15px rgba(0, 0, 0, 0.4);
    }
    
    .menu-btn.secondary:hover {
      transform: translateY(-2px);
      border-color: #4ecdc4;
      color: #4ecdc4;
    }
    
    .menu-btn.secondary:active {
      transform: translateY(6px);
      box-shadow: 
        0 0 0 #1a1a2e,
        0 2px 5px rgba(0, 0, 0, 0.3);
    }
    
    /* Button icons */
    .btn-icon {
      font-size: 1.2em;
    }
    
    /* Blinking arrow */
    .menu-arrow {
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .menu-btn:hover .menu-arrow {
      opacity: 1;
      animation: arrowBlink 0.5s infinite;
    }
    
    @keyframes arrowBlink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    
    /* How to play section */
    .how-to-play {
      position: relative;
      z-index: 10;
      margin-top: 50px;
      text-align: center;
      padding: 0 20px;
    }
    
    .how-to-play h2 {
      font-size: 0.8rem;
      color: #4ecdc4;
      margin-bottom: 20px;
    }
    
    .instructions {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 600px;
    }
    
    .instruction-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .instruction-icon {
      font-size: 2rem;
    }
    
    .instruction-text {
      font-size: 0.5rem;
      color: #888;
      max-width: 100px;
      text-align: center;
      line-height: 1.5;
    }
    
    /* Footer */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
    }
    
    .footer p {
      font-size: 0.5rem;
      color: #555;
    }
    
    .footer a {
      color: #4ecdc4;
      text-decoration: none;
    }
    
    /* Responsive */
    @media (max-width: 600px) {
      .menu-btn {
        min-width: 240px;
        padding: 15px 30px;
      }
      
      .instructions {
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Animated road background -->
    <div class="road-bg"></div>
    
    <!-- Floating pixel decorations -->
    <div class="pixel-decoration"></div>
    <div class="pixel-decoration"></div>
    <div class="pixel-decoration"></div>
    <div class="pixel-decoration"></div>
    <div class="pixel-decoration"></div>
    
    <!-- Game Logo -->
    <div class="logo-container">
      <h1 class="game-title">JUST DRIFT</h1>
      <p class="tagline">OUTRUN THE COPS. DRIFT TO SURVIVE.</p>
    </div>
    
    <!-- Car Showcase -->
    <div class="car-showcase">
      <img src="/just_drift_2.jpeg" alt="Getaway Car">
    </div>
    
    <!-- Menu -->
    <nav class="menu-container">
      <a href="/display" class="menu-btn primary">
        <span class="menu-arrow">▶</span>
        <span class="btn-icon">🎮</span>
        <span>PLAY GAME</span>
      </a>
      
      <a href="/controller" class="menu-btn secondary">
        <span class="menu-arrow">▶</span>
        <span class="btn-icon">📱</span>
        <span>CONTROLLER</span>
      </a>
      
      <button class="menu-btn secondary" onclick="showHowToPlay()">
        <span class="menu-arrow">▶</span>
        <span class="btn-icon">❓</span>
        <span>HOW TO PLAY</span>
      </button>
    </nav>
    
    <!-- How to Play -->
    <div class="how-to-play" id="how-to-play">
      <h2>「 HOW TO PLAY 」</h2>
      <div class="instructions">
        <div class="instruction-item">
          <span class="instruction-icon">🖥️</span>
          <span class="instruction-text">Open DISPLAY on laptop</span>
        </div>
        <div class="instruction-item">
          <span class="instruction-icon">📱</span>
          <span class="instruction-text">Open CONTROLLER on phone</span>
        </div>
        <div class="instruction-item">
          <span class="instruction-icon">🔢</span>
          <span class="instruction-text">Enter room code to connect</span>
        </div>
        <div class="instruction-item">
          <span class="instruction-icon">🏎️</span>
          <span class="instruction-text">Outrun the police!</span>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <p>Built by <a href="#">Build.Srivatsa</a></p>
    </div>
  </div>
  
  <script>
    function showHowToPlay() {
      const section = document.getElementById('how-to-play');
      section.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
